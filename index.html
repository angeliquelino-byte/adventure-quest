<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Easy Round</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="parchment">
    <h2 class="glow">🟢 Easy Round</h2>

    <div class="question">
      <p>What language do computers understand?</p>
      <input type="text" id="q1" placeholder="Type your answer">
      <button onclick="checkAnswer('q1','Binary')">Submit</button>
      <p id="q1-feedback"></p>
    </div>

    <div class="question">
      <p>Which civilization invented cuneiform?</p>
      <input type="text" id="q2" placeholder="Type your answer">
      <button onclick="checkAnswer('q2','Sumerians')">Submit</button>
      <p id="q2-feedback"></p>
    </div>

    <div class="question">
      <p>Largest organ in the human body?</p>
      <input type="text" id="q3" placeholder="Type your answer">
      <button onclick="checkAnswer('q3','Skin')">Submit</button>
      <p id="q3-feedback"></p>
    </div>

    <a href="difficult1.html" class="btn">Proceed to Difficult Round</a>
  </div>
</body>
</html>
