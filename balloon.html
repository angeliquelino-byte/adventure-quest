<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Balloon Surprise</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="parchment">
    <h2 class="glow">🎈 Pop the Balloons!</h2>
    <div class="balloons">
      <div class="balloon red" onclick="popBalloon(this,'31 Years kana nganiii!')"></div>
      <div class="balloon green" onclick="popBalloon(this,'<img src=\'assets/images/surprise1.jpg\' alt=\'Surprise\'>')"></div>
      <div class="balloon purple" onclick="popBalloon(this,'🎊 Happy Birthday!')"></div>
    </div>
  </div>
</body>
</html>
